training:
  seed: 42
  image_size: [224, 224]
  batch_size: 16
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  mixed_precision: true
  early_stopping_patience: 5

dataset:
  root: dataset
  train_dir: dataset/train
  test_dir: dataset/test
  split_manifest_dir: data/splits
  split_seed: 42
  physical_class_folders:
    - glioma
    - meningioma
    - notumor
    - pituitary
  canonical_class_names:
    - glioma
    - meningioma
    - pituitary
    - no_tumor

model:
  architecture: resnet18
  num_classes: 4
  pretrained: true

optimizer:
  name: adamw

scheduler:
  name: reduce_on_plateau
  mode: max
  factor: 0.5
  patience: 2
  min_lr: 0.000001

checkpoint:
  monitor: val_macro_f1
  mode: max
  model_dir: artifacts/models
  training_dir: artifacts/training
  best_filename: resnet18_baseline_best.pt
  last_filename: resnet18_baseline_last.pt
  history_json: resnet18_baseline_history.json
  history_csv: resnet18_baseline_history.csv
